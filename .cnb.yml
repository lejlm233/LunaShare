# CNB 云端流水线：main 分支每次推送后，用官方 git-sync 插件把代码同步到 GitHub。
# GitHub 令牌存于密钥仓库 luxi2035/lunashare-secrets 的 env.yml（经 imports 注入为环境变量）。
# 推送在 CNB 云端执行，云端出口可达 GitHub，不依赖本机网络。
main:
  push:
    - imports:
        - https://cnb.cool/luxi2035/lunashare-secrets/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/lejlm233/LunaShare.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main # 只同步 main 分支
            push_tags: true # 连 tag 一起推
            force: false # 不强推：GitHub 侧若分叉会显式失败，避免静默覆盖
